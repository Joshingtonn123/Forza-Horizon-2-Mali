name: Build FH2 Mali Recomp APK

on:
  push:
    branches:
      - FH2
  workflow_dispatch:
    inputs:
      confirm_own_dump:
        description: "Confirm FH2_DUMP_URL points to your own legally obtained Xbox 360 FH2 ISO"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fh2-mali-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    if: github.ref == 'refs/heads/FH2' && (github.event_name == 'push' || inputs.confirm_own_dump)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - name: Check branch and required secret
        shell: bash
        env:
          FH2_DUMP_URL: ${{ secrets.FH2_DUMP_URL }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/FH2" ]]; then
            echo "::error::Run this workflow on the FH2 branch only."
            exit 1
          fi
          if [[ -z "${FH2_DUMP_URL}" ]]; then
            echo "::error::Add FH2_DUMP_URL as a repository Actions secret first. It must be a private direct-download URL for your own Xbox 360 FH2 ISO."
            exit 1
          fi

      - name: Check out FH2 branch
        uses: actions/checkout@v4
        with:
          ref: FH2
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images \
            /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Install Linux build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 lld cmake ninja-build python3 git curl unzip
          clang-20 --version
          cmake --version

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.30.5"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download personal Xbox 360 dump privately
        shell: bash
        env:
          FH2_DUMP_URL: ${{ secrets.FH2_DUMP_URL }}
        run: |
          set -euo pipefail
          mkdir -p assets/game_root
          curl --fail --location --retry 3 --retry-delay 3 \
            --output "${RUNNER_TEMP}/fh2-own-dump.iso" "${FH2_DUMP_URL}"
          test -s "${RUNNER_TEMP}/fh2-own-dump.iso"
          df -h /

      - name: Fetch SDK third-party sources
        run: python3 tools/fetch_thirdparty.py

      - name: Extract Xbox 360 game files
        run: python3 tools/fase1_extraer.py "${{ runner.temp }}/fh2-own-dump.iso" -o assets/game_root

      - name: Build ReXGlue code generator
        shell: bash
        run: |
          set -euo pipefail
          cmake -S sdk -B sdk/out/linux-amd64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_ENABLE_TRACY=OFF
          cmake --build sdk/out/linux-amd64 --target rexglue --parallel 2
          test -x sdk/out/linux-amd64/rexglue

      - name: Generate FH2 C++ from default.xex
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/game_root/default.xex
          REXGLUE="$GITHUB_WORKSPACE/sdk/out/linux-amd64/rexglue" tools/codegen.sh app
          test -f app/generated/default/sources.cmake

      - name: Build Android release APK
        shell: bash
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          ./build_android.sh
          test -s android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/FH2-Mali-Recomp.apk
          rm -f "${RUNNER_TEMP}/fh2-own-dump.iso"
          rm -rf assets/game_root app/generated sdk/out

      - name: Upload FH2 Mali Recomp APK
        uses: actions/upload-artifact@v4
        with:
          name: FH2-Mali-Recomp
          path: dist/FH2-Mali-Recomp.apk
          if-no-files-found: error
          retention-days: 14
