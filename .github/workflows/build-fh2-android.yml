name: Build FH2 Android APK

on:
  # Build automatically after every change to FH2 so mobile-only contributors do not need to dispatch runs manually.
  push:
    branches:
      - FH2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout FH2
        uses: actions/checkout@v4

      - name: Inspect runner resources
        run: |
          set -eu
          echo "=== Disk space before cleanup ==="
          df -h /
          echo "=== All mounted filesystems ==="
          df -h
          echo "=== Available inodes ==="
          df -i /
          echo "=== RAM ==="
          free -h

      - name: Free runner disk space
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install Linux code-generation tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake ninja-build python3 git curl pkg-config libvulkan-dev libx11-xcb-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev wayland-protocols
          clang-20 --version
          clang++-20 --version
          cmake --version

      - name: Fetch SDK third-party sources
        run: python3 tools/fetch_thirdparty.py

      - name: Prepare default.xex for code generation
        env:
          FH2_DEFAULT_XEX_URL: ${{ secrets.FH2_DEFAULT_XEX_URL }}
          FH2_ISO_URL: ${{ secrets.FH2_ISO_URL }}
        run: |
          set -eu
          mkdir -p assets/game_root /tmp/fh2-input

          if [ -n "${FH2_DEFAULT_XEX_URL:-}" ]; then
            echo "Downloading default.xex directly (smaller input)."
            touch assets/game_root/default.xex
            curl --http1.1 --fail --location --retry 10 --retry-all-errors --retry-delay 5 --continue-at - \
              --output assets/game_root/default.xex "$FH2_DEFAULT_XEX_URL"
          elif [ -n "${FH2_ISO_URL:-}" ]; then
            echo "Downloading game archive from FH2_ISO_URL (ZIP archives are supported; only default.xex will be extracted)."
            curl --http1.1 --fail --location --retry 10 --retry-all-errors --retry-delay 5 --continue-at - \
              --output /tmp/fh2-input/game-download.bin "$FH2_ISO_URL"
            test -s /tmp/fh2-input/game-download.bin

            if python3 -c 'import sys; sys.exit(0 if open(sys.argv[1], "rb").read(2) == b"PK" else 1)' /tmp/fh2-input/game-download.bin; then
              echo "ZIP archive detected; extracting only default.xex, not the full game folder."
              python3 - <<'PY'
          import shutil
          import zipfile

          archive = "/tmp/fh2-input/game-download.bin"
          required = ("default.xex", "XMediaFacade_default.xex", "SpeechFacade_default.xex")
          with zipfile.ZipFile(archive) as zf:
              members = [name for name in zf.namelist() if not name.endswith("/")]
              for wanted in required:
                  matches = [
                      name for name in members
                      if name.replace("\\", "/").rsplit("/", 1)[-1].lower() == wanted.lower()
                  ]
                  if not matches:
                      raise SystemExit("::error::ZIP archive is missing required file: " + wanted)
                  if len(matches) > 1:
                      print("Multiple matches for", wanted, "; using:", matches[0])
                  output = "assets/game_root/" + wanted
                  with zf.open(matches[0]) as source, open(output, "wb") as target:
                      shutil.copyfileobj(source, target, length=1024 * 1024)
                  print("Extracted:", matches[0], "->", output)
          PY
            else
              echo "ZIP signature not found; treating the download as an ISO image."
              mv /tmp/fh2-input/game-download.bin /tmp/fh2-input/ForzaHorizon2.iso
              python3 tools/fase1_extraer.py /tmp/fh2-input/ForzaHorizon2.iso -o assets/game_root
            fi
          else
            echo "::error::No game input URL is configured, so code generation cannot start."
            echo "Add FH2_DEFAULT_XEX_URL or FH2_ISO_URL under Repository Settings > Secrets and variables > Actions."
            echo "Use a private direct-download URL for your own legally obtained game files; do not commit the ISO/XEX to this repository."
            exit 1
          fi

          for xex in default.xex XMediaFacade_default.xex SpeechFacade_default.xex; do
            test -s "assets/game_root/$xex"
            if [ "$(head -c 4 "assets/game_root/$xex")" != "XEX2" ]; then
              echo "::error::assets/game_root/$xex is not a valid XEX2 file."
              exit 1
            fi
          done
          rm -rf /tmp/fh2-input
          ls -lh assets/game_root/default.xex
          echo "=== Disk space after preparing game input ==="
          df -h /

      - name: Build ReXGlue host code generator and generate game C++
        run: |
          set -eu
          cmake -S sdk -B sdk/out/linux-amd64 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DCMAKE_CXX_FLAGS="-mssse3"
          cmake --build sdk/out/linux-amd64 --target rexglue --parallel 2
          test -x sdk/out/linux-amd64/rexglue

          REXGLUE="$PWD/sdk/out/linux-amd64/rexglue" tools/codegen.sh app

          cmake -S app -B app/out/linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DREXSDK_DIR="$PWD/sdk" \
            -DCMAKE_CXX_FLAGS="-mssse3"
          cmake --build app/out/linux --parallel 2
          test -s app/generated/default/sources.cmake

      - name: Remove temporary game files and host build
        run: |
          set -eu
          rm -rf assets/game_root app/out/linux
          echo "=== Disk space before Android build ==="
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android build tools
        run: |
          set -eu
          sdkmanager "ndk;28.2.13676358" "cmake;3.30.5"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          set -eu
          chmod +x build_android.sh
          ./build_android.sh
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FH2-Reborn-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
