name: Build FH2 Android APK

on:
  push:
    branches:
      - FH2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout FH2
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Install Linux code-generation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake ninja-build python3 git curl
          clang-20 --version
          cmake --version

      - name: Fetch SDK third-party sources
        run: python3 tools/fetch_thirdparty.py

      - name: Prepare default.xex for code generation
        env:
          FH2_DEFAULT_XEX_URL: ${{ secrets.FH2_DEFAULT_XEX_URL }}
          FH2_ISO_URL: ${{ secrets.FH2_ISO_URL }}
        run: |
          set -eu
          mkdir -p assets/game_root /tmp/fh2-input

          if [ -n "${FH2_DEFAULT_XEX_URL:-}" ]; then
            echo "Downloading default.xex directly (smaller input)."
            curl --fail --location --retry 3 --retry-delay 5 \
              --output assets/game_root/default.xex "$FH2_DEFAULT_XEX_URL"
          elif [ -n "${FH2_ISO_URL:-}" ]; then
            echo "No FH2_DEFAULT_XEX_URL set; falling back to the full ISO."
            curl --fail --location --retry 3 --retry-delay 5 \
              --output /tmp/fh2-input/ForzaHorizon2.iso "$FH2_ISO_URL"
            test -s /tmp/fh2-input/ForzaHorizon2.iso
            python3 tools/fase1_extraer.py /tmp/fh2-input/ForzaHorizon2.iso -o assets/game_root
            rm -f /tmp/fh2-input/ForzaHorizon2.iso
          else
            echo "::error::Configure FH2_DEFAULT_XEX_URL or FH2_ISO_URL in Settings > Secrets and variables > Actions."
            echo "FH2_DEFAULT_XEX_URL should be a private direct-download URL for your own default.xex."
            echo "FH2_ISO_URL can be used instead for your own legally obtained FH2 Xbox 360 ISO."
            exit 1
          fi

          test -s assets/game_root/default.xex
          if [ "$(head -c 4 assets/game_root/default.xex)" != "XEX2" ]; then
            echo "::error::The downloaded file is not a valid XEX2 default.xex. Check that the URL serves the file itself, not a web page."
            exit 1
          fi
          rm -rf /tmp/fh2-input
          ls -lh assets/game_root/default.xex
          df -h /

      - name: Generate game C++ and build host tools
        run: |
          set -eu
          cmake -S app -B app/out/linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DREXSDK_DIR="$PWD/sdk"
          cmake --build app/out/linux --parallel 2
          test -s app/generated/default/sources.cmake

      - name: Remove temporary game files and host build
        run: |
          set -eu
          rm -rf assets/game_root app/out/linux
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android build tools
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.30.5"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          set -eu
          chmod +x build_android.sh
          ./build_android.sh
          test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FH2-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
